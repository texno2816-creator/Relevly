{% extends "base.html" %}
{% block title %}Test mode — Relevly{% endblock %}
{% block content %}
<section class="page-band band narrow">
  <div class="wrap">
    <p class="kicker">For the developer</p>
    <h1>Test mode</h1>
    <p class="lead">Shows all scored papers, time and tokens, and opens the admin page.</p>
    <form method="post" class="login-form">
      <label for="password">Password</label>
      <input id="password" type="password" name="password" required autofocus>
      <button type="submit" class="btn btn-primary">Log in</button>
    </form>
  </div>
</section>
{% endblock %}
